# Include inside the existing HTTPS server {} for www.chuhaijian.com.
location = /task {
    return 308 /task/;
}
location /task/ {
    # Trailing slash strips /task/ before forwarding to Python.
    proxy_pass http://127.0.0.1:8765/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Relay attachments allow 100MB per file; leave headroom so Nginx does not
    # reject the boundary case with an HTML 413 before the app sees it.
    client_max_body_size 110m;
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; media-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    add_header Referrer-Policy same-origin always;
}
# Legacy local automation endpoints are not exposed by this deployment.
location ^~ /task/api/ {
    return 404;
}
