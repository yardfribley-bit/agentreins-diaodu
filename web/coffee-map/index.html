<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b2414">
<title>咖啡数字地图 · 天通苑 | AgentReins Hub</title>
<link rel="stylesheet" href="./leaflet/leaflet.css">
<script src="./leaflet/leaflet.js"></script>
<style>
:root{
 --espresso:#2a1a10;--roast:#3b2414;--mocha:#6b4226;--caramel:#c8873e;--crema:#e9c89b;--latte:#f4e9dc;--foam:#fbf7f2;
 --ink:#2b211b;--sub:#85766a;--line:#ecdfd1;--card:#fff;--accent:#d9682b;--ok:#2e9b5f;--real:#1d5fb8;--demo:#a86400;
 --r:14px;--sh:0 8px 28px rgba(59,36,20,.16);--ease:cubic-bezier(.22,.8,.26,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:var(--ink);background:var(--foam);-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
/* header */
header{background:radial-gradient(120% 160% at 0% 0%,#5a3620 0%,var(--roast) 45%,var(--espresso) 100%);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:relative;z-index:1200}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,var(--crema),var(--caramel));display:grid;place-items:center;font-size:22px;box-shadow:inset 0 -2px 0 #0002}
.ttl h1{font-size:18px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
.ttl .subt{font-size:11.5px;color:var(--crema);margin-top:2px;opacity:.9}
.hctl{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.select{position:relative}
.select select{appearance:none;-webkit-appearance:none;background:#ffffff1c;border:1px solid #ffffff30;color:#fff;border-radius:10px;padding:7px 30px 7px 12px;cursor:pointer;font-size:13.5px;transition:background .2s}
.select select:hover{background:#ffffff2a}
.select select option{color:var(--ink)}
.select::after{content:"▾";position:absolute;right:11px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--crema);font-size:12px}
.search{display:flex;align-items:center;gap:6px;background:#fff;border-radius:10px;padding:0 10px;width:260px;transition:box-shadow .2s}
.search:focus-within{box-shadow:0 0 0 3px #e9c89b80}
.search input{border:none;outline:none;padding:8px 0;font-size:13.5px;flex:1;min-width:0;background:none}
.search .x{border:none;background:none;cursor:pointer;color:var(--sub);display:none}
.search.has .x{display:block}
.brandtag{font-size:11px;color:var(--crema);opacity:.85;text-align:right;line-height:1.4}
/* banner + flow */
.demo-banner{background:#fff4e0;border-bottom:1px solid #f1d7a6;color:#7a4b00;font-size:12px;padding:6px 18px;display:flex;gap:6px;align-items:center}
.demo-banner b{color:#a35a00}
.flow{background:#fff;border-bottom:1px solid var(--line);padding:7px 18px;display:flex;align-items:center;gap:6px;font-size:12px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.step{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--latte);color:var(--sub);transition:all .35s var(--ease)}
.step .dot{width:7px;height:7px;border-radius:50%;background:#cdbba8}
.step.done{background:#e6f5ec;color:var(--ok)}.step.done .dot{background:var(--ok)}
.step.active{background:#fdeadd;color:var(--accent);font-weight:600}.step.active .dot{background:var(--accent);animation:pulse 1s infinite}
.arrow{color:#cdbba8}
.flow .meta{margin-left:auto;color:var(--sub);padding-left:14px}
.btn-ghost{border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 10px;cursor:pointer;font-size:12px;color:var(--mocha);transition:all .2s}
.btn-ghost:hover{background:var(--latte)}
@keyframes pulse{50%{opacity:.3}}
/* stats strip */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px 18px;background:linear-gradient(var(--foam),var(--foam));border-bottom:1px solid var(--line)}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:10px;transition:transform .25s var(--ease),box-shadow .25s}
.stat:hover{transform:translateY(-1px);box-shadow:0 4px 14px #3b24140f}
.stat .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:var(--latte);flex-shrink:0}
.stat .k{font-size:11px;color:var(--sub)}
.stat .v{font-size:18px;font-weight:700;color:var(--roast);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v small{font-size:11px;font-weight:400;color:var(--sub);margin-left:3px}
.stat.hl .v{color:var(--accent)}
/* main */
main{flex:1;display:flex;min-height:0;position:relative}
aside{width:390px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:1000}
.grab{display:none}
.filters{padding:12px 14px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.frow{display:flex;gap:8px;align-items:flex-start}
.frow>label{font-size:11.5px;color:var(--sub);width:34px;flex-shrink:0;padding-top:5px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--foam);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;user-select:none;transition:all .18s var(--ease);display:inline-flex;align-items:center;gap:4px}
.chip:hover{border-color:var(--crema)}
.chip.on{background:var(--mocha);border-color:var(--mocha);color:#fff}
.chip .sw{width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 1.5px #fff}
.seg{display:inline-flex;background:var(--latte);border-radius:10px;padding:3px;position:relative}
.seg button{border:none;background:none;padding:4px 14px;font-size:12.5px;border-radius:8px;cursor:pointer;color:var(--sub);position:relative;z-index:1;transition:color .2s}
.seg button.on{color:#fff}
.seg .pill{position:absolute;top:3px;bottom:3px;border-radius:8px;background:var(--mocha);transition:all .3s var(--ease);z-index:0}
/* range */
.range{flex:1;padding-top:2px}
.range .vals{display:flex;justify-content:space-between;font-size:12px;color:var(--roast);font-weight:600;margin-bottom:2px}
.range .track{position:relative;height:22px}
.range .track .bar{position:absolute;left:0;right:0;top:9px;height:4px;border-radius:2px;background:var(--line)}
.range .track .fill{position:absolute;top:9px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--caramel),var(--accent))}
.range input{position:absolute;left:0;width:100%;top:0;height:22px;-webkit-appearance:none;appearance:none;background:none;pointer-events:none;margin:0}
.range input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--mocha);box-shadow:0 1px 4px #0003;cursor:pointer}
.range input::-moz-range-thumb{pointer-events:auto;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--mocha);cursor:pointer}
.listhd{padding:8px 14px;font-size:12px;color:var(--sub);border-bottom:1px solid var(--line);background:var(--foam);display:flex;justify-content:space-between;align-items:center}
.list{flex:1;overflow-y:auto;padding:8px 10px 14px;scroll-behavior:smooth}
.item{display:flex;gap:10px;padding:10px;border-radius:12px;border:1px solid transparent;cursor:pointer;transition:all .2s var(--ease);margin-bottom:4px;animation:fadeIn .3s var(--ease) both}
.item:hover{background:var(--foam);border-color:var(--line)}
.item.sel{background:#fdf1e6;border-color:var(--crema);box-shadow:0 2px 10px #c8873e22}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.badge{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex-shrink:0;box-shadow:inset 0 -3px 0 #0002}
.item .info{flex:1;min-width:0}
.item .name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .addr{font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.item .tags{margin-top:5px;display:flex;gap:4px;flex-wrap:wrap}
.tag{white-space:nowrap;display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:5px;border:1px solid;line-height:1.5}
.tag.real{color:var(--real);border-color:#bcd3f0;background:#eef5fd}
.tag.demo{color:var(--demo);border-color:#efd3a0;background:#fff7e8}
.item .price{text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.item .price b{font-size:19px;color:var(--accent);letter-spacing:-.3px}
.item .price small{font-size:10.5px;color:var(--sub)}
.empty{padding:40px 20px;text-align:center;color:var(--sub);font-size:13px;line-height:1.8}
.empty .big{font-size:40px;margin-bottom:6px}
/* map */
.mapwrap{flex:1;position:relative;display:flex;min-width:0}
#map{flex:1;min-height:0;background:#eee6dc}
.pin{background:none;border:none}
.pin div{transform:translate(-50%,-100%);position:absolute;left:0;top:0;background:#fff;border:2px solid var(--c);color:var(--ink);font-weight:700;font-size:12px;padding:2px 8px 2px 6px;border-radius:999px;white-space:nowrap;box-shadow:0 3px 8px #3b241433;transition:transform .2s var(--ease)}
.pin div::after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--c)}
.pin div i{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:4px}
.pin:hover div{transform:translate(-50%,-100%) scale(1.08)}
.pin.sel div{background:var(--c);color:#fff;transform:translate(-50%,-100%) scale(1.18)}
.pin.sel div i{background:#fff}
.legend{position:absolute;left:12px;bottom:22px;z-index:900;background:#fffffff2;border-radius:12px;padding:8px 11px;font-size:11.5px;box-shadow:var(--sh);line-height:1.8;backdrop-filter:blur(6px)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.mapempty{position:absolute;inset:0;z-index:950;display:none;align-items:center;justify-content:center;pointer-events:none}
.mapempty.show{display:flex}
.mapempty .box{pointer-events:auto;background:#fffffff5;border-radius:18px;box-shadow:var(--sh);padding:22px 26px;text-align:center;max-width:320px;animation:pop .35s var(--ease)}
.mapempty .box h3{font-size:16px;color:var(--roast);margin:6px 0}
.mapempty .box p{font-size:12.5px;color:var(--sub);line-height:1.7}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
/* detail */
.card{position:absolute;right:16px;top:16px;bottom:16px;width:440px;overflow:hidden;background:#fff;border-radius:18px;box-shadow:var(--sh);z-index:1100;display:flex;flex-direction:column;transform:translateX(calc(100% + 24px));opacity:0;transition:transform .4s var(--ease),opacity .3s}
.card.show{transform:none;opacity:1}
.card .hd{padding:16px 18px 12px;background:linear-gradient(160deg,var(--latte),#fff 70%);border-bottom:1px solid var(--line);position:relative}
.card .hd .top{display:flex;gap:12px;align-items:center}
.card .hd h2{font-size:17px;padding-right:30px;line-height:1.35}
.card .hd .meta{font-size:12px;color:var(--sub);margin-top:8px;display:flex;flex-direction:column;gap:4px}
.card .actions{display:flex;gap:8px;margin-top:10px}
.nav{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;text-decoration:none;border-radius:10px;padding:7px 14px;font-size:13px;font-weight:600;box-shadow:0 3px 10px #d9682b44;transition:transform .15s,box-shadow .2s}
.nav:hover{transform:translateY(-1px);box-shadow:0 5px 14px #d9682b55}
.nav.sm{padding:3px 9px;font-size:11.5px;border-radius:8px;box-shadow:none;font-weight:500}
.close{position:absolute;right:12px;top:12px;border:none;background:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:13px;box-shadow:0 1px 4px #0002;transition:transform .2s}
.close:hover{transform:rotate(90deg)}
.card .bd{padding:6px 18px 16px;overflow-y:auto;flex:1}
.card h3{font-size:14px;margin:14px 0 6px;display:flex;justify-content:space-between;align-items:baseline;color:var(--roast)}
.card h3 span{font-size:11.5px;color:var(--sub);font-weight:400}
.ptable{display:flex;flex-direction:column;gap:5px}
.prow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 10px;border-radius:10px;background:var(--foam);border:1px solid transparent;transition:all .2s}
.prow.best{background:#fdeee2;border-color:#f3c7a4}
.prow.off{opacity:.45}
.prow .pf{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.prow .pf .sw{width:8px;height:8px;border-radius:50%}
.prow .pp{font-size:16px;font-weight:700;text-align:right;white-space:nowrap}
.prow.best .pp{color:var(--accent)}
.prow .pp s{font-size:11px;color:#b3a79c;font-weight:400;margin-right:4px}
.prow .src{font-size:11px;color:var(--sub);display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.prow .tm{font-size:11px;color:var(--sub);text-align:right;white-space:nowrap}
.prow.na .pp{color:#c2b8ae;font-size:12px;font-weight:400}
.besttag{font-size:10px;background:var(--accent);color:#fff;border-radius:4px;padding:0 5px;font-weight:500}
.note{font-size:11.5px;color:var(--sub);margin-top:14px;line-height:1.7;background:var(--foam);border-radius:10px;padding:9px 11px;border:1px dashed var(--line)}
.backdrop{display:none}
/* mobile */
@media (max-width:820px){
 header{padding:8px 12px;gap:8px}
 .ttl h1{font-size:16px}.ttl .subt{font-size:10.5px}
 .logo{width:34px;height:34px;font-size:18px}
 .brandtag{display:none}
 .hctl{width:100%;margin-left:0;flex-wrap:nowrap}
 .select select{padding:7px 26px 7px 10px;font-size:13px;max-width:130px}
 .search{flex:1;width:auto}
 .demo-banner{font-size:11px;padding:5px 12px}
 .demo-banner .long{display:none}
 .flow{padding:5px 12px;font-size:11px}
 .flow .meta,.flow .btn-ghost{display:none}
 .stats{grid-template-columns:repeat(4,1fr);gap:6px;padding:7px 10px}
 .stat{padding:6px 7px;flex-direction:column;align-items:flex-start;gap:0}
 .stat .ic{display:none}
 .stat .v{font-size:14px}
 .stat .k{font-size:10px}
 aside{position:absolute;left:0;right:0;bottom:0;width:100%;height:82%;border-right:none;border-radius:20px 20px 0 0;box-shadow:0 -8px 30px #3b241426;transform:translateY(calc(100% - var(--peek,170px)));transition:transform .45s var(--ease)}
 aside.half{transform:translateY(45%)}
 aside.full{transform:none}
 .grab{display:flex;justify-content:center;padding:8px 0 2px;cursor:grab;touch-action:none}
 .grab span{width:42px;height:5px;border-radius:3px;background:#d8c8b6}
 .filters{padding-top:4px}
 .legend{display:none}
 .card{left:0;right:0;top:auto;bottom:0;width:auto;max-height:78%;border-radius:20px 20px 0 0;transform:translateY(105%);opacity:1}
 .card.show{transform:none}
 .backdrop{display:block;position:absolute;inset:0;background:#2a1a1033;z-index:1050;opacity:0;pointer-events:none;transition:opacity .3s}
 .backdrop.show{opacity:1;pointer-events:auto}
}
</style>
</head>
<body>
<header>
  <div class="logo">☕</div>
  <div class="ttl">
    <h1>咖啡数字地图 · <span id="areaTitle">天通苑</span></h1>
    <div class="subt">由 AgentReins Hub + AgentReins 手机端采集</div>
  </div>
  <div class="hctl">
    <div class="select"><select id="area" aria-label="商圈"></select></div>
    <label class="search" id="searchBox">🔍<input id="q" placeholder="搜索店名或地址，如 龙德、北一区" autocomplete="off"><button class="x" id="qx" aria-label="清除">✕</button></label>
  </div>
  <div class="brandtag">www.chuhaijian.com<br>原型 v0.2</div>
</header>
<div class="demo-banner">⚠️ <span><b>原型说明：</b>瑞幸 8 家门店的位置与官方价格为<b>真实数据</b><span class="long">（瑞幸官方接口，<span id="realTime"></span>）</span>；其他咖啡馆以及美团外卖 / 淘宝闪购 / 京东秒送 / 抖音团购的价格均为<b>示例数据</b>，仅用于展示效果，不代表实际价格。</span></div>
<div class="flow" id="flow">
  <div class="step"><span class="dot"></span>Hub 下发任务</div><span class="arrow">→</span>
  <div class="step"><span class="dot"></span>手机采集</div><span class="arrow">→</span>
  <div class="step"><span class="dot"></span>回传</div><span class="arrow">→</span>
  <div class="step"><span class="dot"></span>更新地图</div>
  <span class="meta" id="flowMeta">任务 #CM-TTY-001 · 只读采集，不下单</span>
  <button class="btn-ghost" id="replay">模拟刷新</button>
</div>
<section class="stats" id="stats"></section>
<main>
  <aside id="panel">
    <div class="grab" id="grab"><span></span></div>
    <div class="filters">
      <div class="frow"><label>饮品</label><div class="seg" id="drinkSeg"><span class="pill"></span><button data-drink="美式" class="on">美式</button><button data-drink="拿铁">拿铁</button></div>
        <div style="margin-left:auto" class="seg" id="sortSeg"><span class="pill"></span><button data-sort="price" class="on">价格最低</button><button data-sort="dist">距离最近</button></div></div>
      <div class="frow"><label>平台</label><div class="chips" id="pfChips"></div></div>
      <div class="frow"><label>品牌</label><div class="chips" id="brandChips"></div></div>
      <div class="frow"><label>价格</label><div class="range" id="range">
        <div class="vals"><span id="rMin"></span><span id="rMax"></span></div>
        <div class="track"><div class="bar"></div><div class="fill" id="rFill"></div>
        <input type="range" id="lo" min="0" max="40" step="1" value="0" aria-label="最低价"><input type="range" id="hi" min="0" max="40" step="1" value="40" aria-label="最高价"></div>
      </div></div>
    </div>
    <div class="listhd"><span id="listInfo"></span><button class="btn-ghost" id="reset">重置筛选</button></div>
    <div class="list" id="list"></div>
  </aside>
  <div class="mapwrap">
    <div id="map"></div>
    <div class="legend" id="legend"></div>
    <div class="mapempty" id="mapEmpty"><div class="box"><div style="font-size:38px">🗺️</div><h3 id="meTitle"></h3><p id="meText"></p></div></div>
    <div class="backdrop" id="backdrop"></div>
    <div class="card" id="card"></div>
  </div>
</main>
<script>
// ===== 数据 =====
// 坐标为 GCJ-02（与高德瓦片一致）。中心：天通苑
const CENTER=[40.07,116.42];
const REAL_TIME='2026-11-01 21:45';   // 北京时间，瑞幸接口查询时间
const DEMO_TIME='2026-11-01 21:30';   // 示例数据的模拟采集时间
const PLATFORMS=[
  {k:'official',n:'品牌官方'},
  {k:'meituan',n:'美团外卖'},
  {k:'taobao',n:'淘宝闪购'},
  {k:'jd',n:'京东秒送'},
  {k:'douyin',n:'抖音团购(抖省省)'}
];
const BRANDS={
  '瑞幸':{c:'#1a4fa0',s:'瑞'},
  '库迪':{c:'#d9381e',s:'库'},
  '星巴克':{c:'#00704a',s:'星'},
  'Manner':{c:'#7a1f1f',s:'M'},
  '幸运咖':{c:'#e53935',s:'幸'},
  '独立咖啡馆':{c:'#8d6e63',s:'独'}
};
// 瑞幸：真实门店（queryShopList）+ 真实官方价（searchProductForMcp，大杯 标准美式 / 拿铁）
// initialPrice = 标价, estimatePrice = App 预估到手价
const luckinReal=[
 {id:389043,name:'瑞幸咖啡（天通苑北一区店）',addr:'昌平区太平庄中二街天通苑甲5号底商',lat:40.075971,lng:116.414246,hours:'07:00-22:00'},
 {id:385558,name:'瑞幸咖啡（华联天通苑店）',addr:'昌平区东三旗路28号华联天通苑购物中心负一层B1-ZD-24号',lat:40.070308,lng:116.414877,hours:'09:00-21:00'},

// 简单可复现的伪随机，用于生成示例平台价
let seed=7;function rnd(){seed=(seed*9301+49297)%233280;return seed/233280}
function demoPrice(base,spread){return Math.round((base+(rnd()-0.5)*spread)*10)/10}
function cell(p,src,real,time,orig){return p==null?null:{p,src,real,time,orig}}
function demoPlatforms(baseA,baseL,opts={}){
  const out={'美式':{},'拿铁':{}};
  for(const [d,b] of [['美式',baseA],['拿铁',baseL]]){
    out[d].meituan=cell(demoPrice(b*0.92,3),'手机端·美团外卖',false,DEMO_TIME);
    out[d].taobao=opts.noTaobao?null:cell(demoPrice(b*0.9,3),'手机端·淘宝闪购',false,DEMO_TIME);
    out[d].jd=opts.noJd?null:cell(demoPrice(b*0.95,3),'手机端·京东秒送',false,DEMO_TIME);
    out[d].douyin=opts.noDy?null:cell(demoPrice(b*0.8,2.5),'手机端·抖音团购',false,DEMO_TIME);
  }
  return out;
}

// ===== v2 扩展 =====
const PF_COLOR={official:'#6b4226',meituan:'#f5b800',taobao:'#ff6a00',jd:'#e1251b',douyin:'#111'};
const PF_SHORT={official:'品牌官方',meituan:'美团外卖',taobao:'淘宝闪购',jd:'京东秒送',douyin:'抖音团购'};
const AREAS=[
 {k:'tty',n:'天通苑',c:[40.07,116.42],live:true},
 {k:'wj',n:'望京',c:[39.9965,116.4705]},
 {k:'zgc',n:'中关村',c:[39.9837,116.3164]},
 {k:'gm',n:'国贸',c:[39.9087,116.4602]},
 {k:'xeq',n:'西二旗',c:[40.0530,116.3060]}
];
function dist(a,b){const R=6371e3,toR=x=>x*Math.PI/180;const dLat=toR(b[0]-a[0]),dLng=toR(b[1]-a[1]);const h=Math.sin(dLat/2)**2+Math.cos(toR(a[0]))*Math.cos(toR(b[0]))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
cafes.forEach(c=>c.dist=dist(CENTER,[c.lat,c.lng]));
const fmtD=m=>m<1000?Math.round(m)+' m':(m/1000).toFixed(2)+' km';
const fmtP=p=>'¥'+String(+p.toFixed(2));
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const navUrl=c=>`https://uri.amap.com/marker?position=${c.lng},${c.lat}&name=${encodeURIComponent(c.name)}&src=agentreins.coffeemap&coordinate=gaode&callnative=1`;

const state={area:'tty',drink:'美式',sort:'price',q:'',brands:new Set(Object.keys(BRANDS)),pfs:new Set(PLATFORMS.map(p=>p.k)),lo:0,hi:40,sel:null};
function cheapest(c,d){let best=null;for(const pf of PLATFORMS){if(!state.pfs.has(pf.k))continue;const x=c.prices[d][pf.k];if(x&&(!best||x.p<best.p))best={...x,k:pf.k,n:pf.n}}return best}

// ===== 地图 =====
const map=L.map('map',{zoomControl:false,attributionControl:true}).setView(CENTER,15);
L.control.zoom({position:'topleft'}).addTo(map);
L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',{subdomains:['1','2','3','4'],maxZoom:18,attribution:'© 高德地图'}).addTo(map);
const centerMk=L.circleMarker(CENTER,{radius:7,color:'#fff',weight:3,fillColor:'#d9682b',fillOpacity:1}).addTo(map).bindTooltip('天通苑（中心）',{direction:'top'});
const ring=L.circle(CENTER,{radius:1500,color:'#6b4226',weight:1,dashArray:'4 6',fill:false}).addTo(map);
const markers={};
const isMobile=()=>matchMedia('(max-width:820px)').matches;

function filtered(){
  const d=state.drink,q=state.q.trim().toLowerCase();
  if(state.area!=='tty')return [];
  return cafes.filter(c=>state.brands.has(c.brand)&&(!q||(c.name+c.addr+c.brand).toLowerCase().includes(q)))
    .map(c=>({c,best:cheapest(c,d)})).filter(r=>r.best&&r.best.p>=state.lo&&r.best.p<=state.hi)
    .sort((a,b)=>state.sort==='price'?(a.best.p-b.best.p||a.c.dist-b.c.dist):(a.c.dist-b.c.dist));
}
function renderStats(rows){
  const el=document.getElementById('stats');
  if(!rows.length){el.innerHTML=[['🏪','店铺数','0'],['☕','平均价','—'],['💰','最低价','—'],['🏆','最常最低平台','—']].map(([i,k,v])=>`<div class="stat"><div class="ic">${i}</div><div><div class="k">${k}</div><div class="v">${v}</div></div></div>`).join('');return}
  const ps=rows.map(r=>r.best.p),avg=ps.reduce((a,b)=>a+b,0)/ps.length,min=Math.min(...ps);
  const cnt={};rows.forEach(r=>cnt[r.best.k]=(cnt[r.best.k]||0)+1);
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  const minShop=rows.find(r=>r.best.p===min).c;
  el.innerHTML=`
   <div class="stat"><div class="ic">🏪</div><div><div class="k">店铺数</div><div class="v">${rows.length}<small>家</small></div></div></div>
   <div class="stat"><div class="ic">☕</div><div><div class="k">${state.drink}平均价</div><div class="v">${fmtP(avg)}</div></div></div>
   <div class="stat hl"><div class="ic">💰</div><div style="min-width:0"><div class="k">最低价</div><div class="v" title="${esc(minShop.name)}">${fmtP(min)}<small>${esc(minShop.brand)}</small></div></div></div>
   <div class="stat"><div class="ic">🏆</div><div style="min-width:0"><div class="k">最常最低平台</div><div class="v">${PF_SHORT[top[0]]}<small>${top[1]}/${rows.length}</small></div></div></div>`;
}
function renderList(rows){
  const list=document.getElementById('list');
  document.getElementById('listInfo').textContent=state.area==='tty'?`共 ${rows.length} 家 · 按${state.sort==='price'?'价格':'距离'}排序`:'该商圈暂无数据';
  if(state.area!=='tty'){const a=AREAS.find(x=>x.k===state.area);list.innerHTML=`<div class="empty"><div class="big">⏳</div><b>${a.n}</b> 即将上线<br>暂无数据，Hub 尚未向该商圈下发采集任务</div>`;return}
  if(!rows.length){list.innerHTML=`<div class="empty"><div class="big">☕</div>没有符合条件的门店<br>试试放宽价格区间或平台筛选</div>`;return}
  list.innerHTML=rows.map(({c,best},i)=>{const b=BRANDS[c.brand];return `<div class="item${state.sel===c.id?' sel':''}" data-id="${c.id}" style="animation-delay:${Math.min(i*25,300)}ms">
    <div class="badge" style="background:${b.c}">${b.s}</div>
    <div class="info"><div class="name">${esc(c.name)}</div><div class="addr">${fmtD(c.dist)} · ${esc(c.addr)}</div>
    <div class="tags">${c.realLoc?'<span class="tag real">位置真实</span><span class="tag real">官方价真实</span><span class="tag demo">平台价示例</span>':'<span class="tag demo">示例数据</span>'}</div></div>
    <div class="price"><b>${fmtP(best.p)}</b><small>${best.n}</small>${best.real?'<small style="color:var(--real)">真实</small>':'<small style="color:var(--demo)">示例</small>'}
    <a class="nav sm" href="${navUrl(c)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🧭 导航</a></div></div>`}).join('');
  list.querySelectorAll('.item').forEach(el=>el.onclick=()=>select(el.dataset.id,true));
}
function renderMarkers(rows){
  Object.values(markers).forEach(m=>map.removeLayer(m));for(const k in markers)delete markers[k];
  rows.forEach(({c,best})=>{const b=BRANDS[c.brand];const sel=String(state.sel)===String(c.id);
    const icon=L.divIcon({className:'pin'+(sel?' sel':''),html:`<div style="--c:${b.c}"><i></i>${fmtP(best.p)}</div>`,iconSize:[0,0]});
    markers[c.id]=L.marker([c.lat,c.lng],{icon,zIndexOffset:sel?1000:0,title:c.name}).addTo(map).on('click',()=>select(c.id,false));});
}
function render(){
  const rows=filtered();renderStats(rows);renderList(rows);renderMarkers(rows);
  const live=state.area==='tty';
  document.getElementById('mapEmpty').classList.toggle('show',!live);
  if(state.sel){const c=cafes.find(x=>String(x.id)===String(state.sel));if(c&&rows.some(r=>r.c===c))showCard(c);else closeCard(true)}
}
function select(id,pan){state.sel=id;const c=cafes.find(x=>String(x.id)===String(id));if(pan)map.flyTo([c.lat,c.lng],Math.max(map.getZoom(),16),{duration:.6});render()}
function priceRows(c,d){
  const best=cheapest(c,d);
  return `<h3>${d}<span>${best?`最低 ${fmtP(best.p)} · ${best.n}`:'所选平台无价格'}</span></h3><div class="ptable">`+PLATFORMS.map(pf=>{
    const x=c.prices[d][pf.k],on=state.pfs.has(pf.k);
    const sw=`<span class="sw" style="background:${PF_COLOR[pf.k]}"></span>`;
    if(!x)return `<div class="prow na${on?'':' off'}"><div class="pf">${sw}${pf.n}</div><div class="pp">未上架</div><div class="src">—</div><div class="tm">—</div></div>`;
    const isBest=on&&best&&x.p===best.p;
    return `<div class="prow${isBest?' best':''}${on?'':' off'}"><div class="pf">${sw}${pf.n}${isBest?'<span class="besttag">最低</span>':''}</div>
      <div class="pp">${x.orig?`<s>¥${x.orig}</s>`:''}${fmtP(x.p)}</div>
      <div class="src">${x.src}<span class="tag ${x.real?'real':'demo'}">${x.real?'真实':'示例数据'}</span>${on?'':'<span class="tag" style="color:#999;border-color:#ddd">已筛除</span>'}</div><div class="tm">${x.time.slice(5)} 北京</div></div>`}).join('')+'</div>';
}
function showCard(c){
  const card=document.getElementById('card'),b=BRANDS[c.brand];
  card.innerHTML=`<div class="hd"><button class="close" id="closeBtn" aria-label="关闭">✕</button>
   <div class="top"><div class="badge" style="background:${b.c}">${b.s}</div><h2>${esc(c.name)}</h2></div>
   <div class="meta"><span>📍 ${esc(c.addr)}</span><span>🚶 距${'天通苑'}中心 ${fmtD(c.dist)} · 🕘 ${c.hours}</span>
   <span>${c.realLoc?'<span class="tag real">位置：瑞幸官方（真实）</span> <span class="tag real">官方价：真实</span> <span class="tag demo">平台价：示例</span>':'<span class="tag demo">位置与价格：示例数据</span>'}</span></div>
   <div class="actions"><a class="nav" href="${navUrl(c)}" target="_blank" rel="noopener">🧭 一键导航（高德）</a></div></div>
   <div class="bd">${priceRows(c,'美式')}${priceRows(c,'拿铁')}
   <div class="note">${c.prodNote}。<br>平台价由 AgentReins 手机端按定位在各 App 内<b>只读</b>查看后回传 Hub（当前为示例数据）；全程不下单、不领券、按正常浏览节奏采集。时间为北京时间。</div></div>`;
  document.getElementById('closeBtn').onclick=()=>closeCard();
  requestAnimationFrame(()=>card.classList.add('show'));
  if(isMobile())document.getElementById('backdrop').classList.add('show');
}
function closeCard(silent){state.sel=null;document.getElementById('card').classList.remove('show');document.getElementById('backdrop').classList.remove('show');if(!silent)render()}
document.getElementById('backdrop').onclick=()=>closeCard();

const areaSel=document.getElementById('area');
areaSel.innerHTML=AREAS.map(a=>`<option value="${a.k}">${a.n}${a.live?'':'（即将上线）'}</option>`).join('');
areaSel.onchange=()=>{state.area=areaSel.value;const a=AREAS.find(x=>x.k===state.area);

  closeCard(true);map.flyTo(a.c,15,{duration:.8});centerMk.setLatLng(a.c).setTooltipContent(a.n+'（中心）');ring.setLatLng(a.c);render()};
const qi=document.getElementById('q'),sb=document.getElementById('searchBox');
qi.oninput=()=>{state.q=qi.value;sb.classList.toggle('has',!!qi.value);render()};
document.getElementById('qx').onclick=e=>{e.preventDefault();qi.value='';state.q='';sb.classList.remove('has');render()};
function seg(id,key){const s=document.getElementById(id),pill=s.querySelector('.pill');
  const place=()=>{const on=s.querySelector('button.on');pill.style.left=on.offsetLeft+'px';pill.style.width=on.offsetWidth+'px'};
  s.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{s.querySelectorAll('button').forEach(x=>x.classList.remove('on'));btn.classList.add('on');state[key]=btn.dataset[key];place();render()});
  requestAnimationFrame(place);addEventListener('resize',place)}
seg('drinkSeg','drink');seg('sortSeg','sort');
function chipSet(id,items,set,swatch){const box=document.getElementById(id);
  items.forEach(([k,label,color])=>{const s=document.createElement('span');s.className='chip on';s.innerHTML=(color?`<span class="sw" style="background:${color}"></span>`:'')+label;
    s.onclick=()=>{if(set.has(k)){if(set.size===1)return;set.delete(k)}else set.add(k);s.classList.toggle('on');render()};box.appendChild(s)})}
chipSet('pfChips',PLATFORMS.map(p=>[p.k,PF_SHORT[p.k],PF_COLOR[p.k]]),state.pfs);
chipSet('brandChips',Object.entries(BRANDS).map(([k,v])=>[k,k,v.c]),state.brands);
const lo=document.getElementById('lo'),hi=document.getElementById('hi');
function syncRange(e){let a=+lo.value,b=+hi.value;if(a>b){if(e&&e.target===lo)lo.value=a=b;else hi.value=b=a}
  state.lo=a;state.hi=b;document.getElementById('rMin').textContent='¥'+a;document.getElementById('rMax').textContent=b>=40?'¥40+':'¥'+b;
  const f=document.getElementById('rFill');f.style.left=a/40*100+'%';f.style.width=(b-a)/40*100+'%';if(b>=40)state.hi=Infinity;if(e)render()}
lo.oninput=hi.oninput=syncRange;syncRange();
document.getElementById('reset').onclick=()=>{state.q='';qi.value='';sb.classList.remove('has');lo.value=0;hi.value=40;syncRange();
  state.brands=new Set(Object.keys(BRANDS));state.pfs=new Set(PLATFORMS.map(p=>p.k));
  document.getElementById('pfChips').innerHTML='';document.getElementById('brandChips').innerHTML='';
  chipSet('pfChips',PLATFORMS.map(p=>[p.k,PF_SHORT[p.k],PF_COLOR[p.k]]),state.pfs);chipSet('brandChips',Object.entries(BRANDS).map(([k,v])=>[k,k,v.c]),state.brands);render()};
document.getElementById('legend').innerHTML=Object.entries(BRANDS).map(([k,v])=>`<div><i style="background:${v.c}"></i>${k}</div>`).join('')+'<div style="color:#85766a;margin-top:2px">标签 = 所选平台最低价</div>';

const panel=document.getElementById('panel'),grab=document.getElementById('grab');
const states=['','half','full'];let ps=1;panel.classList.add('half');
function setSheet(i){ps=Math.max(0,Math.min(2,i));panel.classList.remove('half','full');if(states[ps])panel.classList.add(states[ps])}
grab.onclick=()=>setSheet(ps===2?0:ps+1);
let sy=null;grab.addEventListener('touchstart',e=>{sy=e.touches[0].clientY},{passive:true});
grab.addEventListener('touchend',e=>{if(sy==null)return;const dy=e.changedTouches[0].clientY-sy;if(Math.abs(dy)>30)setSheet(ps+(dy<0?1:-1));sy=null});
map.on('click',()=>{if(isMobile()&&ps>0)setSheet(0)});

// ===== 任务流程（模拟）=====
const flowTexts=['Hub 已下发任务 #CM-TTY-001（天通苑 · 4 个平台）','手机端采集中：美团外卖 → 淘宝闪购 → 京东秒送 → 抖音团购','回传 17 家门店 / 136 条价格到 Hub','地图已更新 · '+DEMO_TIME+'（示例）'];
function runFlow(final){const steps=[...document.querySelectorAll('.step')],meta=document.getElementById('flowMeta');
  if(final){steps.forEach(s=>s.className='step done');meta.textContent=flowTexts[3];return}
  let i=0;(function tick(){steps.forEach((s,j)=>s.className='step'+(j<i?' done':j===i?' active':''));meta.textContent=flowTexts[i];
    if(i<3){i++;setTimeout(tick,1100)}else setTimeout(()=>runFlow(true),900)})()}
document.getElementById('replay').onclick=()=>runFlow(false);
render();
if(location.hash.startsWith('#static'))runFlow(true);else runFlow(false);
if(location.hash==='#static'||location.search.includes('demo=card'))select(389043,false);
