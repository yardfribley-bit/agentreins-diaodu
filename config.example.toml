[server]
host = "127.0.0.1"
port = 8765
# 本地运行留空；通过 /task/ 反向代理部署时改为 "/task"
public_base_path = ""
public_origin = ""
secure_cookies = false

[network]
https_proxy = "http://127.0.0.1:1087"
http_proxy = "http://127.0.0.1:1087"

[vault]
path = ""

[agents.codex]
command = "/usr/local/bin/codex"
timeout_seconds = 120
ignore_user_config = true

[agents.workbuddy]
command = "/Applications/WorkBuddy.app/Contents/Resources/app.asar.unpacked/cli/bin/codebuddy"
timeout_seconds = 600

[agents.grok]
base_url = "https://api.x.ai/v1"
model = "grok-4.7"
timeout_seconds = 180

[agents.doubao]
# 豆包桌面版没有无头命令。填一条已登录、已连接抖音的命令。
# 调度室把本轮提示词作为最后一个参数传入，工作目录是该任务目录。
command = ""
timeout_seconds = 600
